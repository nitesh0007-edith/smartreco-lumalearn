<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">LumaLearn system architecture</title>
  <desc id="desc">Architecture showing the learner experience, behavioral event pipeline, LangGraph recommendation workflow, Mesh API AI boundary, Chroma retrieval, SQL persistence, transactional vector outbox, scheduler, and operational evidence.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11101a"/>
      <stop offset="0.55" stop-color="#181426"/>
      <stop offset="1" stop-color="#102129"/>
    </linearGradient>
    <linearGradient id="violetCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#322860"/>
      <stop offset="1" stop-color="#221d3d"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12343c"/>
      <stop offset="1" stop-color="#17272f"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b301c"/>
      <stop offset="1" stop-color="#282318"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b8cff"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4bd8e6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f1b95b"/>
    </marker>
    <style>
      .eyebrow { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.8px; fill: #a99cff; }
      .title { font: 750 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .subtitle { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #aaa6bb; }
      .lane { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .cardTitle { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .cardText { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #bbb7ca; }
      .miniTitle { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .miniText { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #aaa6bb; }
      .edgeLabel { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d0cadf; letter-spacing: .3px; }
      .pill { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .7px; }
    </style>
  </defs>

  <rect width="1600" height="1120" rx="30" fill="url(#background)"/>
  <rect width="1600" height="1120" rx="30" fill="url(#grid)"/>
  <circle cx="1490" cy="-30" r="310" fill="#6d5dfc" opacity="0.08"/>
  <circle cx="35" cy="1110" r="280" fill="#27c4d4" opacity="0.06"/>

  <g transform="translate(58 44)">
    <rect width="48" height="48" rx="14" fill="#6d5dfc"/>
    <text x="24" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">L</text>
    <text x="70" y="16" class="eyebrow">LUMALEARN / SYSTEM DESIGN</text>
    <text x="70" y="57" class="title">From learner behaviour to grounded guidance</text>
    <text x="70" y="88" class="subtitle">Three coordinated planes: experience, intelligence, and dependable operations.</text>
  </g>

  <!-- Experience plane -->
  <g>
    <rect x="50" y="155" width="1500" height="190" rx="24" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="78" y="186" class="lane" fill="#a99cff">01  EXPERIENCE PLANE</text>

    <g filter="url(#shadow)">
      <rect x="80" y="210" width="300" height="105" rx="18" fill="url(#violetCard)" stroke="#7364d9"/>
      <circle cx="113" cy="243" r="16" fill="#6d5dfc"/>
      <path d="M105 243h16M113 235v16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="143" y="247" class="cardTitle">Learner experience</text>
      <text x="105" y="280" class="cardText">Search · browse · click · dwell · cart · learn</text>
      <rect x="105" y="292" width="111" height="18" rx="9" fill="#6d5dfc" fill-opacity="0.22"/>
      <text x="160" y="305" text-anchor="middle" class="pill" fill="#c8c0ff">JINJA UI</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="500" y="210" width="280" height="105" rx="18" fill="#211e31" stroke="#4f486b"/>
      <text x="525" y="247" class="cardTitle">Event queue</text>
      <text x="525" y="274" class="cardText">5s batches · sendBeacon flush</text>
      <text x="525" y="297" class="miniText">typed payloads + client IDs</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="900" y="210" width="300" height="105" rx="18" fill="#211e31" stroke="#4f486b"/>
      <text x="925" y="247" class="cardTitle">FastAPI application</text>
      <text x="925" y="274" class="cardText">Auth · pages · events · refresh API</text>
      <text x="925" y="297" class="miniText">CSRF + signed HTTP-only sessions</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1320" y="210" width="200" height="105" rx="18" fill="url(#cyanCard)" stroke="#2a9eaa"/>
      <text x="1345" y="247" class="cardTitle">Product UI</text>
      <text x="1345" y="274" class="cardText">For You</text>
      <text x="1345" y="297" class="miniText">Your Signal · Admin</text>
    </g>

    <path d="M380 263 H486" fill="none" stroke="#9b8cff" stroke-width="3" marker-end="url(#arrowViolet)"/>
    <path d="M780 263 H886" fill="none" stroke="#9b8cff" stroke-width="3" marker-end="url(#arrowViolet)"/>
    <path d="M1200 263 H1306" fill="none" stroke="#4bd8e6" stroke-width="3" marker-end="url(#arrowCyan)"/>
    <text x="422" y="250" class="edgeLabel">observe</text>
    <text x="819" y="250" class="edgeLabel">ingest</text>
    <text x="1233" y="250" class="edgeLabel">render</text>
  </g>

  <!-- Intelligence plane -->
  <g>
    <rect x="50" y="375" width="1500" height="390" rx="24" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="78" y="406" class="lane" fill="#63dfeb">02  RECOMMENDATION INTELLIGENCE</text>

    <g filter="url(#shadow)">
      <rect x="80" y="455" width="265" height="225" rx="18" fill="#211e31" stroke="#4f486b"/>
      <text x="105" y="493" class="cardTitle">Intent profile</text>
      <text x="105" y="526" class="cardText">30-day event window</text>
      <text x="105" y="553" class="cardText">weighted interests</text>
      <text x="105" y="580" class="cardText">role + search terms</text>
      <text x="105" y="607" class="cardText">novelty + ownership</text>
      <rect x="105" y="632" width="160" height="25" rx="12.5" fill="#6d5dfc" fill-opacity="0.2"/>
      <text x="185" y="649" text-anchor="middle" class="pill" fill="#c8c0ff">SHA-256 FINGERPRINT</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="390" y="455" width="220" height="225" rx="18" fill="url(#amberCard)" stroke="#9f7635"/>
      <text x="415" y="493" class="cardTitle">Refresh gate</text>
      <text x="415" y="528" class="cardText">≥ 5 new events</text>
      <text x="415" y="555" class="cardText">or high-intent search</text>
      <text x="415" y="590" class="cardText">10-minute cooldown</text>
      <text x="415" y="617" class="cardText">unchanged → cached</text>
      <rect x="415" y="635" width="118" height="25" rx="12.5" fill="#f1b95b" fill-opacity="0.17"/>
      <text x="474" y="652" text-anchor="middle" class="pill" fill="#ffd58e">COST AWARE</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="655" y="430" width="570" height="285" rx="22" fill="url(#violetCard)" stroke="#7869e8" stroke-width="1.5"/>
      <text x="683" y="469" class="cardTitle">Bounded LangGraph agent</text>
      <text x="683" y="495" class="miniText">explicit state transitions · timed node trace · one refinement maximum</text>

      <rect x="685" y="530" width="92" height="66" rx="13" fill="#171521" stroke="#6d5dfc"/>
      <text x="731" y="558" text-anchor="middle" class="miniTitle">Analyse</text>
      <text x="731" y="578" text-anchor="middle" class="miniText">signal</text>

      <rect x="798" y="530" width="98" height="66" rx="13" fill="#171521" stroke="#6d5dfc"/>
      <text x="847" y="558" text-anchor="middle" class="miniTitle">Retrieve</text>
      <text x="847" y="578" text-anchor="middle" class="miniText">candidates</text>

      <rect x="917" y="530" width="92" height="66" rx="13" fill="#171521" stroke="#6d5dfc"/>
      <text x="963" y="558" text-anchor="middle" class="miniTitle">Grade</text>
      <text x="963" y="578" text-anchor="middle" class="miniText">quality</text>

      <rect x="1030" y="530" width="88" height="66" rx="13" fill="#171521" stroke="#a67c38"/>
      <text x="1074" y="558" text-anchor="middle" class="miniTitle">Refine</text>
      <text x="1074" y="578" text-anchor="middle" class="miniText">once</text>

      <rect x="1000" y="625" width="190" height="62" rx="13" fill="#171521" stroke="#26adba"/>
      <text x="1095" y="652" text-anchor="middle" class="miniTitle">Generate + validate</text>
      <text x="1095" y="673" text-anchor="middle" class="miniText">schema + retrieved-ID allow-list</text>

      <path d="M777 563 H788" stroke="#9b8cff" stroke-width="2.5" marker-end="url(#arrowViolet)"/>
      <path d="M896 563 H907" stroke="#9b8cff" stroke-width="2.5" marker-end="url(#arrowViolet)"/>
      <path d="M1009 563 H1020" stroke="#f1b95b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
      <path d="M1074 596 V612 H1095 V615" fill="none" stroke="#f1b95b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
      <path d="M963 596 V656 H987" fill="none" stroke="#4bd8e6" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
      <path d="M1074 530 V510 H847 V520" fill="none" stroke="#f1b95b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
      <text x="997" y="515" class="miniText" fill="#ffd58e">quality &lt; 0.32</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1270" y="430" width="250" height="125" rx="18" fill="url(#cyanCard)" stroke="#2a9eaa"/>
      <text x="1295" y="468" class="cardTitle">Mesh API</text>
      <text x="1295" y="496" class="cardText">embeddings + chat</text>
      <text x="1295" y="522" class="miniText">the only AI network boundary</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1270" y="590" width="250" height="125" rx="18" fill="#172832" stroke="#387b9c"/>
      <text x="1295" y="628" class="cardTitle">Chroma</text>
      <text x="1295" y="656" class="cardText">cosine vector retrieval</text>
      <text x="1295" y="682" class="miniText">active catalogue documents only</text>
    </g>

    <path d="M345 568 H376" stroke="#9b8cff" stroke-width="3" marker-end="url(#arrowViolet)"/>
    <path d="M610 568 H641" stroke="#9b8cff" stroke-width="3" marker-end="url(#arrowViolet)"/>
    <path d="M1225 492 H1256" stroke="#4bd8e6" stroke-width="3" marker-end="url(#arrowCyan)"/>
    <path d="M1225 652 H1256" stroke="#4bd8e6" stroke-width="3" marker-end="url(#arrowCyan)"/>
    <text x="354" y="552" class="edgeLabel">score</text>
    <text x="615" y="552" class="edgeLabel">run</text>
  </g>

  <!-- Operations plane -->
  <g>
    <rect x="50" y="795" width="1500" height="255" rx="24" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="78" y="826" class="lane" fill="#f1b95b">03  RELIABILITY &amp; EVIDENCE PLANE</text>

    <g filter="url(#shadow)">
      <rect x="80" y="865" width="240" height="130" rx="18" fill="#211e31" stroke="#4f486b"/>
      <text x="105" y="903" class="cardTitle">Admin CRUD</text>
      <text x="105" y="933" class="cardText">create · edit · soft delete</text>
      <text x="105" y="962" class="miniText">version every catalogue change</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="370" y="865" width="250" height="130" rx="18" fill="#211e31" stroke="#4f486b"/>
      <text x="395" y="903" class="cardTitle">SQL source of truth</text>
      <text x="395" y="933" class="cardText">users · products · events</text>
      <text x="395" y="962" class="miniText">recommendations + event watermark</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="670" y="865" width="240" height="130" rx="18" fill="url(#amberCard)" stroke="#9f7635"/>
      <text x="695" y="903" class="cardTitle">Vector outbox</text>
      <text x="695" y="933" class="cardText">same SQL transaction</text>
      <text x="695" y="962" class="miniText">versioned · retryable · observable</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="960" y="865" width="240" height="130" rx="18" fill="#211e31" stroke="#4f486b"/>
      <text x="985" y="903" class="cardTitle">Scheduler</text>
      <text x="985" y="933" class="cardText">5-minute reconciliation</text>
      <text x="985" y="962" class="miniText">daily opted-in email digest</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1250" y="865" width="270" height="130" rx="18" fill="url(#cyanCard)" stroke="#2a9eaa"/>
      <text x="1275" y="903" class="cardTitle">Operational evidence</text>
      <text x="1275" y="933" class="cardText">trace · decision · model · tokens</text>
      <text x="1275" y="962" class="miniText">outbox status + failure visibility</text>
    </g>

    <path d="M320 930 H356" stroke="#f1b95b" stroke-width="3" marker-end="url(#arrowAmber)"/>
    <path d="M620 930 H656" stroke="#f1b95b" stroke-width="3" marker-end="url(#arrowAmber)"/>
    <path d="M910 930 H946" stroke="#f1b95b" stroke-width="3" marker-end="url(#arrowAmber)"/>
    <path d="M1200 930 H1236" stroke="#4bd8e6" stroke-width="3" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- Cross-plane links -->
  <path d="M1050 315 V365 H212 V441" fill="none" stroke="#9b8cff" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowViolet)"/>
  <text x="594" y="358" class="edgeLabel">accepted, deduplicated events</text>
  <path d="M1095 715 V782 H495 V851" fill="none" stroke="#4bd8e6" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowCyan)"/>
  <text x="720" y="779" class="edgeLabel">store grounded result + run trace</text>
  <path d="M1080 865 V790 H1395 V729" fill="none" stroke="#f1b95b" stroke-opacity="0.75" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowAmber)"/>
  <text x="1180" y="785" class="edgeLabel">reconcile vectors</text>

  <g transform="translate(58 1080)">
    <circle cx="8" cy="0" r="5" fill="#9b8cff"/><text x="22" y="5" class="miniText">learner signal</text>
    <circle cx="163" cy="0" r="5" fill="#4bd8e6"/><text x="177" y="5" class="miniText">AI + retrieval</text>
    <circle cx="322" cy="0" r="5" fill="#f1b95b"/><text x="336" y="5" class="miniText">durability</text>
    <text x="1483" y="5" text-anchor="end" class="miniText">Every recommendation is catalogue-grounded, attributable, and inspectable.</text>
  </g>
</svg>
