[project]
name = "lumalearn-smartreco"
version = "0.1.0"
description = "Behavior-aware, catalog-grounded recommendation agent built for SmartReco 2026"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.coverage.run]
source = ["app"]
omit = ["app/templates/*"]
